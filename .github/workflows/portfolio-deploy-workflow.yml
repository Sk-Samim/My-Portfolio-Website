name: Assume AWS Role

on:
  push:
    branches: [GitHub-Actions-Integration]

permissions:
  id-token: write    # required for OIDC
  contents: read

jobs:
  aws-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # NOTE:
      # Before using aws-actions/configure-aws-credentials@v4 with OIDC,
      # you must add GitHub as an OpenID Connect provider in AWS IAM.
      # Go to IAM → Identity Providers → Add Provider
      # Provider URL: https://token.actions.githubusercontent.com
      # Audience: sts.amazonaws.com
      # Also ensure your IAM role trust policy allows sts:AssumeRoleWithWebIdentity.
      - name: Configure AWS Credentials (Assume Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::730335293937:role/github-actions-role
          aws-region: ap-south-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity
